syntax = "proto3";

option csharp_namespace = "MomoPayment.Protos";

package momo.wallet;

service WalletGrpc {
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);
  rpc TransferFunds (TransferFundsRequest) returns (TransferFundsResponse);
  rpc DepositFunds (DepositFundsRequest) returns (DepositFundsResponse);
  rpc WithdrawFunds (WithdrawFundsRequest) returns (WithdrawFundsResponse);
  rpc VerifyWallet (VerifyWalletRequest) returns (VerifyWalletResponse);
}

message GetBalanceRequest {
  string user_id = 1;
}

message GetBalanceResponse {
  bool success = 1;
  string user_id = 2;
  string wallet_id = 3;
  double balance = 4;
  string currency = 5;
  string error_message = 6;
}

message TransferFundsRequest {
  string sender_user_id = 1;
  string receiver_user_id = 2;
  double amount = 3;
  string transaction_code = 4;
  string description = 5;
}

message TransferFundsResponse {
  bool success = 1;
  double sender_new_balance = 2;
  double receiver_new_balance = 3;
  string error_code = 4;
  string error_message = 5;
}

message DepositFundsRequest {
  string user_id = 1;
  double amount = 2;
  string transaction_code = 3;
  string payment_source = 4;
}

message DepositFundsResponse {
  bool success = 1;
  double new_balance = 2;
  string error_code = 3;
  string error_message = 4;
}

message WithdrawFundsRequest {
  string user_id = 1;
  double amount = 2;
  string transaction_code = 3;
  string bank_code = 4;
  string bank_account_number = 5;
}

message WithdrawFundsResponse {
  bool success = 1;
  double new_balance = 2;
  string error_code = 3;
  string error_message = 4;
}

message VerifyWalletRequest {
  string user_id = 1;
  string phone_number = 2;
}

message VerifyWalletResponse {
  bool exists = 1;
  string user_id = 2;
  string wallet_id = 3;
  string phone_number = 4;
  bool is_active = 5;
  string error_message = 6;
}
